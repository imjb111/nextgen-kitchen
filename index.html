<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Kitchen</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div>
      <h1 class="logo">NextGen Kitchen</h1>
      <p class="subtitle">Premium Food Experience</p>
    </div>

    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Delicious Food Delivered Fast</h2>
    <p>Order your favorite meals instantly.</p>
  </section>

  <section class="menu-section">
    <h2 class="section-title">Popular Menu</h2>

    <div id="menu-container" class="menu-grid"></div>
  </section>

  <div id="cart-panel" class="cart-panel">

    <div class="cart-top">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="toggleCart()">×</button>
    </div>

    <div id="cart-items"></div>

    <div class="checkout-box">
      <h3>Total: ₹<span id="total-price">0</span></h3>

      <input type="text" id="customer-name" placeholder="Your Name">

      <input type="text" id="customer-phone" placeholder="Phone Number">

      <textarea id="customer-address" placeholder="Delivery Address"></textarea>

      <button class="pay-btn" onclick="payNow()">
        Pay & Order
      </button>

      <button class="pdf-btn" onclick="downloadPDF()">
        Download Invoice
      </button>
    </div>

  </div>

  <footer>
    <p>UPI: 8249577736@ybl</p>
    <p>© 2026 NextGen Kitchen</p>
  </footer>

  <script src="script.js"></script>
</body>
